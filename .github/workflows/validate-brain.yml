name: Validate DevOps Brain

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check_brain.py"
      - ".github/workflows/validate-brain.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/check_brain.py"
      - ".github/workflows/validate-brain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check knowledge hygiene
        run: python scripts/check_brain.py
